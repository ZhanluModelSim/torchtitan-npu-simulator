[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "torchtitan-npu"
version = "0.1.0"
description = "Huawei Ascend NPU overrides for torchtitan"
requires-python = ">=3.12"
dependencies = [
    "torchtitan==0.4.0",
    "torch==2.15.0+cpu",
    "torch-npu==2.15.0.dev20261105",
    "attn-gym==0.0.17",
    "torchvision==0.29.2+cpu",
    "grain==0.2.18",
    "renderers==0.1.12",
    "spmd_types==0.3.1",
    "torch_remat==0.2.2",
    "torch_checkpointing==0.1.1",
]

[project.optional-dependencies]
multimodal = [
    "av",
    "einops",
    "pillow",
    "torchvision==0.29.2+cpu",
]
torchft = [
    "torchft==0.2.0",
]

[tool.setuptools.packages.find]
include = ["torchtitan_npu*", "torchtitan_npu_recipes*"]
exclude = ["tests*", "CI*", "third_party*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
markers = [
    "cpu: CPU-only unit test",
    "smoke: NPU smoke test",
    "static: source and declaration contract test",
    "tooling: repository tooling or skill self-test; excluded from product UT coverage",
]

[tool.pyrefly]
project-excludes = [
    "**/tests/**", "CI", "scripts",
    # torch.compile debug dumps written by the rope-compile unit tests.
    "torch_compile_debug",
    # Kernel DSL tensor annotations are not Python type annotations.
    "torchtitan_npu/ops/pypto", "torchtitan_npu/ops/pypto_pro",
    "torchtitan_npu/ops/triton", "torchtitan_npu/ops/tilelang",
    # Re-enable with the DeepSeek-V3.2 folded-token model migration: the model and
    # its override still use the pre-0.4 attention-mask and aux-loss APIs.
    "torchtitan_npu/models/deepseek_v3_2/**",
    "torchtitan_npu/override/deepseek_v3_2/**",
]
ignore-missing-imports = [
    "attn_gym",
    "attn_gym.*",
    "torchao.*",
    "torchao_npu.*",
    "torchft",
    "torchft.*",
    "cann_ops_transformer",
    "cann_ops_transformer.*",
    "tile_kernels",
    "tile_kernels.*",
]
search-path = ["/tmp/torchtitan"]
replace-imports-with-any = ["torch_npu", "torch.npu"]

[[tool.pyrefly.sub-config]]
# These FlexShard backports rebind functions into upstream module globals.
# Their private upstream symbols are resolved only at runtime.
matches = "torchtitan_npu/patches/torchtitan/distributed/flex_shard/**"
[tool.pyrefly.sub-config.errors]
unknown-name = false
missing-attribute = false
bad-assignment = false

[[tool.pyrefly.sub-config]]
# Patch files deliberately monkey-patch upstream modules through full
# ``torchtitan...`` / ``torch...`` paths without importing each submodule.
matches = "torchtitan_npu/patches/**"
[tool.pyrefly.sub-config.errors]
implicit-import = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "N", "C4", "UP", "I", "SIM", "TCH", "PLE", "RUF"]
ignore = [
    "E203",
    "E302",
    "E305",
    "E402",
    "E721",
    "E731",
    "E741",
    "F405",
    "F821",
    "F841",
    "B007",
    "B008",
    "N803",
    "N806",
    "N812",
    "N817",
    "C408",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
]
exclude = [
    ".git",
    ".agents",
    "docs",
    "build",
    "scripts",
    "venv",
    "*.pyi",
    ".pre-commit-config.yaml",
    "*.md",
    ".flake8",
    "tests/",
    "CI",
    "torchtitan_npu/ops/triton",
]
fixable = ["ALL"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["torchtitan_npu", "tests"]
known-third-party = ["attn_gym", "torchtitan"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
